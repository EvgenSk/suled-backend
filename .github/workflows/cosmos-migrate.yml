name: Cosmos DB – Reset Tournaments Container

# ─────────────────────────────────────────────────────────────────────────────
# Deletes the Tournaments container so backend-ci can recreate it with
# partition key /pk via Bicep.
#
# After running this workflow:
#   dev:  push any change to develop — infrastructure-dev job recreates it
#   prod: push any change to main    — infrastructure job recreates it
#
# No data will be lost — there is nothing to preserve.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type DELETE to confirm'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'Production' || 'Development' }}

    steps:
    - name: Validate confirmation
      run: |
        if [ "${{ inputs.confirm }}" != "DELETE" ]; then
          echo "::error::Confirmation text must be exactly DELETE"
          exit 1
        fi

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Delete Tournaments container
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.environment == 'prod' && vars.AZURE_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP_DEV }}
        COSMOS_ACCOUNT:  ${{ inputs.environment == 'prod' && vars.COSMOS_ACCOUNT_NAME || vars.COSMOS_ACCOUNT_NAME_DEV }}
      run: |
        DB_NAME=${{ inputs.environment == 'prod' && 'TournamentDb' || 'TournamentDb-dev' }}
        az cosmosdb sql container delete \
          --account-name   "$COSMOS_ACCOUNT" \
          --resource-group "$RESOURCE_GROUP" \
          --database-name  "$DB_NAME" \
          --name           Tournaments \
          --yes
        echo "✅ Container deleted — push to ${{ inputs.environment == 'prod' && 'main' || 'develop' }} to recreate it with partition key /pk"
