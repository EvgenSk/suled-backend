name: Cosmos DB – Reset Tournaments Container

# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME workflow: deletes the Tournaments container so the regular
# backend-ci "infrastructure" job can recreate it with partition key /pk.
#
# Run this ONCE before pushing the /pk code change to main.
# No data will be lost — there is nothing to preserve.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type DELETE to confirm'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'Production' || 'Development' }}

    steps:
    - name: Validate confirmation
      run: |
        if [ "${{ inputs.confirm }}" != "DELETE" ]; then
          echo "::error::Confirmation text must be exactly DELETE"
          exit 1
        fi

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Delete Tournaments container
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.environment == 'prod' && vars.AZURE_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP_DEV }}
        COSMOS_ACCOUNT:  ${{ inputs.environment == 'prod' && vars.COSMOS_ACCOUNT_NAME || vars.COSMOS_ACCOUNT_NAME_DEV }}
      run: |
        az cosmosdb sql container delete \
          --account-name   "$COSMOS_ACCOUNT" \
          --resource-group "$RESOURCE_GROUP" \
          --database-name  TournamentDb \
          --name           Tournaments \
          --yes
        echo "✅ Container deleted — push to main to recreate it with partition key /pk"
